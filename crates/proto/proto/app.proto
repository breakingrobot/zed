syntax = "proto3";
package zed.messages;

message ShutdownRemoteServer {}

message Toast {
  uint64 project_id = 1;
  string notification_id = 2;
  string message = 3;
}

message HideToast {
  uint64 project_id = 1;
  string notification_id = 2;
}

// A telemetry event generated on the remote server, forwarded to the client for
// reporting. The OS metadata is not included: the client already knows the
// remote platform from connection setup and attaches it when reporting.
message TelemetryEvent {
  uint64 project_id = 1;
  // JSON-serialized telemetry_events::FlexibleEvent { event_type, event_properties }.
  string event_json = 2;
}

message OpenServerSettings {
  uint64 project_id = 1;
}

message GetCrashFiles {}

message GetCrashFilesResponse {
  repeated CrashReport crashes = 1;
  reserved 2; // old panics
}

message CrashReport {
  reserved 1, 2;
  string metadata = 3;
  bytes minidump_contents = 4;
}

message Extension {
  string id = 1;
  string version = 2;
  bool dev = 3;
  optional uint64 content_fingerprint = 4;
}

message SyncExtensions {
  repeated Extension extensions = 1;
}

message SyncExtensionsResponse {
  string tmp_dir = 1;
  repeated Extension missing_extensions = 2;
}

message InstallExtension {
  Extension extension = 1;
  string tmp_dir = 2;
}

message AskPassRequest {
  uint64 project_id = 1;
  reserved 2;
  uint64 repository_id = 3;
  uint64 askpass_id = 4;
  string prompt = 5;
}

message AskPassResponse {
  string response = 1;
}

// The TCP ports listening on the remote server's machine.
message ListListeningPorts {
  uint64 project_id = 1;
}

message ListListeningPortsResponse {
  repeated uint32 ports = 1;
}

// Connects the remote server to one of its machine's TCP ports. The response
// stream carries what the port sends, and ends when it closes.
message OpenPortTunnel {
  uint64 project_id = 1;
  uint64 tunnel_id = 2;
  uint32 port = 3;
}

message OpenPortTunnelResponse {
  bytes data = 1;
}

// Data for the port of an open tunnel.
message PortTunnelData {
  uint64 project_id = 1;
  uint64 tunnel_id = 2;
  bytes data = 3;
}

// Closes the tunnel's connection to its port.
message ClosePortTunnel {
  uint64 project_id = 1;
  uint64 tunnel_id = 2;
}

// Makes git on the remote server's machine ask Zed's machine for credentials.
message EnableGitCredentialForwarding {
  uint64 project_id = 1;
}

// A `git credential` operation (`get`, `store` or `erase`) for git on the remote
// server's machine, with the credential description git gave the helper.
message ForwardGitCredential {
  string operation = 1;
  string input = 2;
}

message ForwardGitCredentialResponse {
  string output = 1;
}

// Makes the remote server relay the SSH agent socket at `socket_path` on its
// machine to the SSH agent of Zed's machine, unless an agent already listens there.
message EnableSshAgentForwarding {
  uint64 project_id = 1;
  string socket_path = 2;
}

// A request to the SSH agent of Zed's machine, without its length prefix.
message ForwardSshAgentMessage {
  bytes data = 1;
}

// The agent's response, without its length prefix.
message ForwardSshAgentMessageResponse {
  bytes data = 1;
}

message GetRemoteProfilingData {
  uint64 project_id = 1;
  bool foreground_only = 2;
}

message GetRemoteProfilingDataResponse {
  repeated RemoteProfilingThread threads = 1;
  uint64 now_nanos = 2;
}

message RemoteProfilingThread {
  optional string thread_name = 1;
  uint64 thread_id = 2;
  repeated RemoteProfilingTiming timings = 3;
}

message RemoteProfilingTiming {
  RemoteProfilingLocation location = 1;
  uint64 start_nanos = 2;
  uint64 duration_nanos = 3;
}

message RemoteProfilingLocation {
  string file = 1;
  uint32 line = 2;
  uint32 column = 3;
}
